services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agriflow
      POSTGRES_PASSWORD: agriflow         # change in production!
      POSTGRES_DB: agriflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://agriflow:agriflow@postgres:5432/agriflow
      REDIS_URL: redis://redis:6379/0
      DEMO_SEED_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./services/api
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://agriflow:agriflow@postgres:5432/agriflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
